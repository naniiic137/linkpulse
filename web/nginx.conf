# LinkPulse edge: one origin for the dashboard, the API and the short links.
#   /api/*, /docs, /health, /ready  -> api service
#   /, /app/*, /stats/*, /login, /signup, /assets/*  -> React SPA (static)
#   anything else (/:code)          -> api service (redirects)
# Aliases that collide with SPA routes are reserved by the API, so the split is unambiguous.

upstream linkpulse_api {
    server api:3501;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-Sent Events: no buffering, long read timeout.
    location ~ ^/api/links/[^/]+/events$ {
        proxy_pass http://linkpulse_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://linkpulse_api;
    }

    location ~ ^/(docs|health|ready)(/|$) {
        proxy_pass http://linkpulse_api;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    # SPA routes.
    location = / {
        try_files /index.html =404;
    }
    location ~ ^/(app|stats|login|signup)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Everything else is a short code (or its password form): hand it to the API.
    location / {
        proxy_pass http://linkpulse_api;
    }
}
